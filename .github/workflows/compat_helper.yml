name: Compat Helper
on:
  workflow_call:
    inputs:
      use_FuseRegistry:
        required: false
        default: true
        type: boolean
jobs:
  CompatHelper:
    name: Compat Helper
    runs-on: ubuntu-latest
    steps:
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true
      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: ${{ runner.arch }}
        if: steps.julia_in_path.outcome != 'success'
      - name: "Add the FuseRegistry via Git"
        if: ${{ inputs.use_FuseRegistry }}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/ProjectTorreyPines/FuseRegistry.jl.git"))
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add(name="CompatHelper", uuid="aa819f21-2bde-4658-8897-bab36330d9b7", version="3")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main(;master_branch="master", use_existing_registries=true)'
